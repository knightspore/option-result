name: Test and Validate PHP Code

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-

    # The lock file targets PHP 8.4. Older versions resolve their own compatible
    # set, without the docs generator, whose dependency tree needs PHP >= 8.2.
    - name: Install dependencies (lock file)
      if: matrix.php-version == '8.4'
      run: composer install --prefer-dist --no-progress

    - name: Install dependencies (resolve for this PHP version)
      if: matrix.php-version != '8.4'
      run: |
        composer remove --dev --no-update --no-interaction phpdocumentor/phpdocumentor saggre/phpdocumentor-markdown
        composer update --prefer-dist --no-progress --no-interaction

    - name: Run Tests
      run: composer test

    - name: Static Analysis
      run: composer analyse

    # Formatting does not depend on the PHP version; lint once with the pinned Pint.
    - name: Lint Codebase
      if: matrix.php-version == '8.4'
      run: composer lint

    - name: Restore composer files
      if: matrix.php-version != '8.4'
      run: git checkout -- composer.json composer.lock

    - name: Commit Changes
      if: matrix.php-version == '8.4'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore(*): lint with pint"
